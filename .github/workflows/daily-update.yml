name: Morning update

# Nepal is UTC+5:45, so both times are offset by 5 hours 45 minutes.
#
#   45 23 UTC  ->  05:30 next morning in Kathmandu   (ready before 06:00)
#   45  8 UTC  ->  14:30 the same afternoon          (ready before 15:00)
#
# Each is set half an hour early on purpose: GitHub's scheduler can run
# 5-20 minutes late when their servers are busy, so the results are always
# waiting by the time you look.
on:
  schedule:
    - cron: "45 23 * * *"
    - cron: "45 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect the news
        run: python scraper.py
        continue-on-error: true

      - name: Save the results
        run: |
          git config user.name  "Career Growth bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data/news.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "News update $(TZ=Asia/Kathmandu date '+%Y-%m-%d %H:%M')"
            git push
          fi
